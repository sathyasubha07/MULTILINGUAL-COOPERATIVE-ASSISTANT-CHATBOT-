version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coop_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ai_engine:/app/ai_engine
      - ./database:/app/database
      - ./config:/app/config
      - ./notifications:/app/notifications
    environment:
      - OFFLINE_MODE=true
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coop_ai_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
